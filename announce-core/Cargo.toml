[package]
name = "announce-core"
description = "Definition-side machinery of announce, as plain functions (use `announce::machinery` instead)"
version = "0.1.0"
edition = "2021"
rust-version = "1.57"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/ozu"

[dependencies]
syn = { version = "2.0.25", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro2 = "1"
template-quote = "0.4"
announce-helper = { path = "../announce-helper", version = "0.1.0" }
type-leak = "0.8"
