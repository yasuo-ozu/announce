[package]
name = "announce-helper"
description = "Helpers for proc-macro crates that consume announce trampolines"
version = "0.1.0"
edition = "2021"
rust-version = "1.56"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/ozu"

# Feature `type-leak` (the optional dependency below) enables
# `leak::StableReferrer`: deterministic numbering on top of type-leak.

[dependencies]
type-leak = { version = "0.8", optional = true }
syn = { version = "2.0.25", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro2 = "1"
template-quote = "0.4"
