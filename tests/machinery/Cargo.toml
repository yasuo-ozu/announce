[package]
name = "announce-test-machinery"
version = "0.0.0"
edition = "2021"
rust-version = "1.57"
publish = false

# Stands in for a proc-macro crate of some library that builds or rewrites
# items and announces them with `announce::machinery`.
[lib]
proc-macro = true

[dependencies]
announce = { path = "../../announce" }
announce-helper = { path = "../../announce-helper" }
syn = { version = "2.0.25", features = ["full", "extra-traits"] }
proc-macro2 = "1"
template-quote = "0.4"
