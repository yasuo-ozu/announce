[package]
name = "announce-test-machinery-lib"
version = "0.0.0"
edition = "2021"
rust-version = "1.57"
publish = false

# The public crate of a library built on `announce::machinery`: it re-exports
# the macros of its proc-macro crate (`announce-test-machinery`) and `announce`,
# so that the library's users need no `announce` dependency.
[dependencies]
announce = { path = "../../announce" }
announce-test-machinery = { path = "../machinery" }
