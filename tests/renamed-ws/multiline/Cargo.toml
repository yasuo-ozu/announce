# A rename written as an inline table over several lines (TOML 1.1, which
# cargo reads since 1.94): the generated code must reach the facade as
# `::ann_multi`.
[package]
name = "announce-test-renamed-multiline"
version = "0.0.0"
edition = "2021"
rust-version = "1.64"
publish = false

[dependencies]
ann-multi = {
    path = "../../..",   # the facade
    features = [],
    package = "announce",
}
