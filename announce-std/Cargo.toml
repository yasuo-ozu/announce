[package]
name = "announce-std"
description = "announce trampolines for std/core traits"
version = "0.2.0"
edition = "2021"
rust-version = "1.57"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/announce"

[features]
default = ["std"]
std = []

[dependencies]
# A definer crate: it needs only the macros and `announce::Announce`, not the
# `proc-macro-api` feature of announce (proc-macro2 and syn), so with its own
# `std` feature off it builds for targets without std.
announce = { path = "..", version = "0.2.0", default-features = false }

[build-dependencies]
rustversion = "1"
