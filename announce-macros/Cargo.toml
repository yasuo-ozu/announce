[package]
name = "announce-macros"
description = "Proc macros of announce (use the `announce` crate instead)"
version = "0.1.0"
edition = "2021"
rust-version = "1.57"
license = "MIT"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
repository = "https://github.com/yasuo-ozu/ozu"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.25", features = ["full", "extra-traits"] }
template-quote = "0.4"
announce-core = { path = "../announce-core", version = "0.1.0" }
announce-helper = { path = "../announce-helper", version = "0.1.0" }
